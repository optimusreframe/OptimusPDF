name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  quality:
    name: Quality (types, lint, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # No --omit=optional: @napi-rs/canvas depende de su binario nativo
      # opcional para Linux, instalado a partir del lockfile.
      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm test

      - run: npm run build

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Solo Chromium: es el unico proyecto configurado en
      # playwright.config.ts, no hace falta bajar Firefox/WebKit.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Subir evidencia de Playwright (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            .evidence/playwright-report
            .evidence/playwright
          retention-days: 7
