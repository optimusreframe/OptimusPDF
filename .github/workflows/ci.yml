name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  quality:
    name: Quality (types, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # No --omit=optional: @napi-rs/canvas depende de su binario nativo
      # opcional para Linux, instalado a partir del lockfile.
      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm run build

  # Las pruebas unitarias (~14 500) tardaban ~35 min en un solo runner y este llegaba a recibir la senal de apagado a mitad
  # (sin ningun fallo de prueba): se reparten en 3 fragmentos en paralelo (~12 min cada uno).
  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npx vitest run --shard=${{ matrix.shard }}/3

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    # La suite E2E ya tiene ~400 pruebas (herramientas, edicion, firma,
    # accesibilidad): se reparte en 5 fragmentos en paralelo (la suite pasa de 1 600 pruebas: con 3 el mas lento rozaba los 45 min) para que cada uno
    # quepa con holgura en el limite. Los barridos de foco repiten cada flujo
    # solo 3 veces en CI (30 en local: `FOCUS_REPS`).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      FOCUS_REPS: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Solo Chromium: es el unico proyecto configurado en
      # playwright.config.ts, no hace falta bajar Firefox/WebKit.
      - run: npx playwright install --with-deps chromium

      # Primera pasada: toda la suite menos las pruebas de rendimiento (`@perf`), con 2 workers. Esas llevan un presupuesto
      # ABSOLUTO de tiempo o de memoria y, con otro navegador pesado al lado en un runner de 2 nucleos, tardaban 2-2,6 veces
      # mas (sin cambio de codigo): pasaban o fallaban segun la prueba que les tocara en el otro worker. Ver `PW_PERF` en
      # playwright.config.ts.
      - run: npx playwright test --shard=${{ matrix.shard }}/5
        env:
          PW_PERF: skip

      # Segunda pasada: solo `@perf`, con UN worker (sin nada al lado) y reutilizando la build de la primera (no recompila;
      # `--pass-with-no-tests`: con pocas pruebas `@perf` hay fragmentos a los que no les toca ninguna). `!cancelled()`: se
      # ejecuta aunque la primera pasada haya fallado, para no esconder un fallo de rendimiento detras de otro.
      - name: E2E de rendimiento (@perf, 1 worker)
        if: ${{ !cancelled() }}
        run: npx playwright test --shard=${{ matrix.shard }}/5 --workers=1 --pass-with-no-tests
        env:
          PW_PERF: only
          PW_SKIP_BUILD: "1"

      - name: Subir evidencia de Playwright (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            .evidence/playwright-report
            .evidence/playwright
            .evidence/playwright-report-perf
            .evidence/playwright-perf
          retention-days: 7
